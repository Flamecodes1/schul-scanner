name: Untis-Stundenplan holen

on:
  schedule:
    # Zeiten in UTC – in Deutschland also 1–2 Stunden später
    - cron: '20 4 * * 1-5'        # morgens vor der Schule
    - cron: '20 6,9,12 * * 1-5'   # tagsüber (Vertretungen)
    - cron: '0 17 * * 0'          # Sonntagabend für die neue Woche
  workflow_dispatch:              # "Jetzt aktualisieren" in der App

permissions:
  contents: write

concurrency:
  group: untis-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bibliotheken installieren
        run: npm install --no-save --no-package-lock --no-audit --no-fund webuntis@2.2.1 otplib@12

      - name: Stundenplan holen
        env:
          UNTIS_URL: ${{ secrets.UNTIS_URL }}
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          UNTIS_QR: ${{ secrets.UNTIS_QR }}
        run: node .github/workflows/untis-sync.mjs

      - name: Speichern
        run: |
          git config user.name "untis-sync"
          git config user.email "untis-sync@users.noreply.github.com"
          git add untis/timetable.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -m "Stundenplan aktualisiert"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
