name: Untis-Stundenplan holen

# Läuft hier im öffentlichen App-Repo (kostenlos) und schreibt den Stundenplan
# direkt in dein PRIVATES Ablage-Repo. Die Logs enthalten keine persönlichen Daten.
#
# Secrets (Settings → Secrets and variables → Actions):
#   UNTIS_URL, UNTIS_USER, UNTIS_PASSWORD   – deine WebUntis-Anmeldung
#   ABLAGE_TOKEN                            – Token mit "Contents: Read and write" für das Ablage-Repo
# Optional: Variable ABLAGE_REPO (Standard: <dein-name>/schul-ablage)

on:
  schedule:
    # Zeiten in UTC – in Deutschland also 1–2 Stunden später
    - cron: '20 4 * * 1-5'        # morgens vor der Schule
    - cron: '20 6,9,12 * * 1-5'   # tagsüber (Vertretungen)
    - cron: '0 17 * * 0'          # Sonntagabend für die neue Woche
  workflow_dispatch:              # "Jetzt aktualisieren" in der App

permissions:
  contents: write                 # nur für den Keepalive-Commit (siehe unten)

concurrency:
  group: untis-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TZ: Europe/Berlin
      ABLAGE_REPO: ${{ vars.ABLAGE_REPO || format('{0}/schul-ablage', github.repository_owner) }}
    steps:
      - name: Einrichtung prüfen
        id: check
        env:
          ABLAGE_TOKEN: ${{ secrets.ABLAGE_TOKEN }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_QR: ${{ secrets.UNTIS_QR }}
        run: |
          missing=""
          [ -z "$ABLAGE_TOKEN" ] && missing="$missing ABLAGE_TOKEN"
          [ -z "$UNTIS_USER$UNTIS_QR" ] && missing="$missing UNTIS_URL/UNTIS_USER/UNTIS_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Es fehlen noch Secrets:$missing – der Abruf wird übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      - name: Ablage auschecken
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ABLAGE_REPO }}
          token: ${{ secrets.ABLAGE_TOKEN }}
          path: ablage

      - uses: actions/setup-node@v7
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Bibliotheken installieren
        if: steps.check.outputs.ok == 'true'
        run: npm install --no-save --no-package-lock --no-audit --no-fund --silent webuntis@2.2.1 otplib@12

      - name: Stundenplan holen
        if: steps.check.outputs.ok == 'true'
        working-directory: ablage
        env:
          UNTIS_URL: ${{ secrets.UNTIS_URL }}
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          UNTIS_QR: ${{ secrets.UNTIS_QR }}
        run: node ../.github/workflows/untis-sync.mjs

      - name: In der Ablage speichern
        if: steps.check.outputs.ok == 'true'
        working-directory: ablage
        run: |
          git config user.name "untis-sync"
          git config user.email "untis-sync@users.noreply.github.com"
          git add untis/timetable.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -q -m "Stundenplan aktualisiert"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1

      # GitHub pausiert geplante Workflows in öffentlichen Repos nach 60 Tagen ohne Commit.
      # Darum alle ~45 Tage ein leerer Commit, damit der Abruf nie einschläft.
      - name: Am Leben halten
        if: steps.check.outputs.ok == 'true'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "untis-sync"
            git config user.email "untis-sync@users.noreply.github.com"
            git commit --allow-empty -q -m "Keepalive für den Stundenplan-Abruf"
            git push --quiet
          fi
